defaults: [default]

# UR-DMU (AAAI'23) — dual memory units + uncertainty regulation on I3D features.
model_class: src.models.ur_dmu.modeling_ur_dmu.URDMUForVideoAnomalyDetection

model_config:
    _target_: src.models.ur_dmu.configuration_ur_dmu.URDMUConfig
    feature_size: 2048
    hidden_size: 512
    num_layers: 2
    num_heads: 4
    mem_size: 60
    topk_ratio: 16
    dropout_rate: 0.5
    attn_impl: eager # exact default. NB: SDPA alone doesn't fit 8GB full-length test —
    # the distance-decay branch materializes a T×T adjacency regardless (O(T²) is structural).
    # -> efficient temporal modeling (sliding-window / bounded distance) is a Spec2 task.
    margin: 1.0
    w_mem: 1.0
    w_triplet: 0.1
    w_kl: 0.001

optimizer:
    learning_rate: 1e-4
    weight_decay: 0.00005
