defaults: [default]

# Sultani MIL baseline (CVPR'18) — simplest sanity-check method.
model_class: src.models.sultani.modeling_sultani.SultaniForVideoAnomalyDetection

model_config:
    _target_: src.models.sultani.configuration_sultani.SultaniConfig
    feature_size: 2048
    hidden1: 512
    hidden2: 32
    dropout_rate: 0.6
    lambda_smooth: 8e-5
    lambda_sparse: 8e-5

# Paper uses Adagrad; Adam(lr 1e-3) is a fine drop-in on cached features.
optimizer:
    learning_rate: 1e-3
    weight_decay: 0.0005
