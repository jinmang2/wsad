[project]
name = "wsad"
version = "0.1.0"
description = "Weakly-supervised video anomaly detection — reproduction + comparison framework"
requires-python = "==3.11.*"

# Pinned to the exact versions the reported reproduction numbers were produced with
# (docs/RESULTS_TABLE.md). Loosen deliberately, not by accident.
dependencies = [
    # core numerics / training
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "einops==0.8.0",
    # backbones / feature extraction
    "transformers==5.10.2",
    "huggingface-hub==1.18.0",
    "safetensors==0.7.0",
    "accelerate==1.13.0",
    "timm==1.0.27",
    "open-clip-torch==3.3.0",
    "decord==0.6.0",
    "av==17.0.1",
    "opencv-python==4.11.0.86",
    # config / data plumbing
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "datasets==4.8.5",
    "pandas==2.2.3",
    "pyarrow==24.0.0",
    "natsort==8.4.0",
    "pillow==12.2.0",
    "tqdm==4.68.1",
    # reporting
    "matplotlib==3.10.9",
    "wandb==0.27.2",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Editable install puts the repo root on sys.path, so `src.*`, `scripts.*` and
# `experiments.*` all import without the old `PYTHONPATH=.` prefix.
[tool.hatch.build.targets.wheel]
packages = ["src"]
dev-mode-dirs = ["."]

# Editing a .py file must not trigger an editable-wheel rebuild on every `uv run`
# (the install is path-based, so the sources are picked up live either way).
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]

# torch/torchvision must come from the CUDA 13.0 wheel index, not PyPI (PyPI ships
# the CPU/cu12 default build). Everything else resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
